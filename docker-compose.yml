services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: trail
      POSTGRES_PASSWORD: trail
      POSTGRES_DB: trail_steward
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trail -d trail_steward']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
