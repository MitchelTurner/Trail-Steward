# tsc reads shared from its built types. Compile that package before the web app.
[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter shared build && pnpm --filter web exec tsc -p tsconfig.json --noEmit && pnpm --filter web exec vite build"
watchPatterns = [
  "apps/web/**",
  "packages/shared/**",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "package.json",
  "railpack.json",
]

[deploy]
startCommand = "pnpm --filter web start"
